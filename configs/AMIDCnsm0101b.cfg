!========================================================================
! OSPF CONFIGURATION
!========================================================================

router ospf 10
  router-id 10.253.9.62
  bfd
  redistribute static subnets route-map REDISTRIBUTE-STATIC-TO-OSPF10
  passive-interface default
  no passive-interface Vlan550
  no passive-interface Vlan551
  no passive-interface Vlan552
  no passive-interface Vlan553

!========================================================================
! BGP CONFIGURATION
!========================================================================

router bgp 64721
  router-id 10.253.9.62
  log-neighbor-changes
  address-family ipv4 unicast
    redistribute static route-map REDISTRIBUTE-STATIC-TO-BGP
  neighbor 10.253.238.34
    remote-as 65520
    description SDW1-BGP-PEER
    password 0 sdwanbgpkey
    bfd
    address-family ipv4 unicast
      send-community both
      soft-reconfiguration inbound
      route-map SDWAN_TO_CORE in
      route-map CORE_TO_SDWAN out
  neighbor 10.253.239.34
    remote-as 65520
    description SDW2-BGP-PEER
    password 0 sdwanbgpkey
    bfd
    address-family ipv4 unicast
      send-community both
      soft-reconfiguration inbound
      route-map SDWAN_TO_CORE in
      route-map CORE_TO_SDWAN out

!========================================================================
! ROUTE-MAPS AND PREFIX-LISTS
!========================================================================

ip prefix-list DEFAULT-ROUTE seq 5 permit 0.0.0.0/0
ip prefix-list STATIC-ROUTES seq 10 permit 10.0.0.0/8 le 32

route-map REDISTRIBUTE-STATIC-TO-OSPF10 permit 10
  match ip address prefix-list STATIC-ROUTES

route-map REDISTRIBUTE-STATIC-TO-BGP permit 10
  match ip address prefix-list DEFAULT-ROUTE

route-map SDWAN_TO_CORE permit 10
  description Accept-all-routes-from-SDWAN

route-map CORE_TO_SDWAN permit 10
  match ip address prefix-list DEFAULT-ROUTE

!========================================================================
! SYSTEM SETTINGS
!========================================================================

no system default switchport shutdown
logging monitor 7
line console
line vty

